{% extends 'base.html' %}

{% block title %}用户注册{% endblock %}

{% block shell %}
<div class="auth-shell">
    <div class="auth-brand">恶意流量检测与 AI-SOC 安全运营平台</div>
    <section class="auth-card">
        <div class="auth-card-header">
            <h1>用户注册</h1>
            <p>创建检测账号，保留原有用户名和密码字段。</p>
        </div>
        <div class="auth-card-body">
            <form method="POST" action="#">
                <div class="form-group">
                    <label for="usernameInput">用户名</label>
                    <input type="text" class="form-control" id="usernameInput" name="username">
                </div>
                <div class="form-group">
                    <label for="exampleInputPassword1">密码</label>
                    <input type="password" class="form-control" id="exampleInputPassword1" name="password">
                </div>
                <div class="form-group">
                    <label for="passwordConfirmInput">确认密码</label>
                    <input type="password" class="form-control" id="passwordConfirmInput" name="password_confirm">
                </div>
                <button type="submit" class="btn-carbon btn-primary-carbon btn-block">立即注册</button>
            </form>
            <div class="mt-3">
                <a href="{{ url_for('auth.login') }}">已有账号，返回登录</a>
            </div>
        </div>
    </section>
</div>
{% endblock %}
