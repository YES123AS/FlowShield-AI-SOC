{% extends 'base.html' %}

{% block title %}用户登录{% endblock %}

{% block shell %}
<div class="auth-shell">
    <div class="auth-brand">恶意流量检测与 AI-SOC 安全运营平台</div>
    <section class="auth-card">
        <div class="auth-card-header">
            <h1>用户登录</h1>
            <p>登录上传PCAP、查看检测记录和AI-SOC安全事件。</p>
        </div>
        <div class="auth-card-body">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="usernameInput">用户名</label>
                    {% if username %}
                    <input type="text" class="form-control" id="usernameInput" name="username" value="{{ username }}">
                    {% else %}
                    <input type="text" class="form-control" id="usernameInput" name="username">
                    {% endif %}
                </div>
                <div class="form-group">
                    <label for="exampleInputPassword1">密码</label>
                    <input type="password" name="password" class="form-control" id="exampleInputPassword1">
                </div>
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <button type="submit" class="btn-carbon btn-primary-carbon btn-block">立即登录</button>
            </form>
            <div class="mt-3 d-flex justify-content-between">
                <a href="{{ url_for('auth.register') }}">创建账号</a>
                <a href="{{ url_for('admin.login') }}">管理员登录</a>
            </div>
        </div>
    </section>
</div>
{% endblock %}
