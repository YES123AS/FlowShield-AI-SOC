{% extends 'base.html' %}

{% block title %}管理员登录{% endblock %}

{% block shell %}
<div class="auth-shell">
    <div class="auth-brand">恶意流量检测与 AI-SOC 安全运营平台</div>
    <section class="auth-card">
        <div class="auth-card-header">
            <h1>管理员登录</h1>
            <p>进入用户管理、日志审计和检测记录管理后台。</p>
        </div>
        <div class="auth-card-body">
            <form action="{{ url_for('admin.login') }}" method="POST">
                <div class="form-group">
                    <label for="adminUsername">管理员用户名</label>
                    {% if username %}
                    <input type="text" class="form-control" id="adminUsername" name="username" value="{{ username }}">
                    {% else %}
                    <input type="text" class="form-control" id="adminUsername" name="username">
                    {% endif %}
                </div>
                <div class="form-group">
                    <label for="adminPassword">管理员密码</label>
                    <input type="password" name="password" class="form-control" id="adminPassword">
                </div>
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <button type="submit" class="btn-carbon btn-primary-carbon btn-block">管理员登录</button>
            </form>
            <div class="mt-3">
                <a href="{{ url_for('auth.login') }}">返回用户登录</a>
            </div>
        </div>
    </section>
</div>
{% endblock %}
